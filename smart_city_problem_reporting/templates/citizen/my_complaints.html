{% extends "citizen/base_citizen.html" %}

{% block content %}

<h3>My Complaints</h3>

<table class="table">

<tr>
<th>ID</th>
<th>Problem</th>
<th>Status</th>
<th>Action</th>
</tr>

{% for c in data %}

<tr>

<td>{{c[0]}}</td>
<td>{{c[2]}}</td>
<td>{{c[8]}}</td>

<td>
<a href="/complaint/{{c[0]}}" class="btn btn-info">View</a>
</td>

</tr>

{% endfor %}

</table>

{% endblock %}
