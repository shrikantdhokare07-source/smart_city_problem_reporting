<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Citizen Register - Smart City</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
}

.register-card{
width:420px;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.register-title{
text-align:center;
margin-bottom:25px;
}

.form-control{
border-radius:8px;
}

.btn-register{
width:100%;
border-radius:8px;
}

.login-link{
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>

<div class="register-card">

<div class="register-title">

<h3>
<i class="fa-solid fa-city"></i> Smart City
</h3>

<p>Citizen Registration</p>

</div>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input type="text"
name="name"
class="form-control"
placeholder="Enter full name"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input type="email"
name="email"
class="form-control"
placeholder="Enter email"
required>

</div>

<div class="mb-3">

<label>Phone</label>

<input type="text"
name="phone"
class="form-control"
placeholder="Enter phone number"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input type="password"
name="password"
class="form-control"
placeholder="Create password"
required>

</div>

<button class="btn btn-success btn-register">

<i class="fa-solid fa-user-plus"></i> Register

</button>

</form>

<div class="login-link">

<p>
Already have an account?
<a href="/login">Login Here</a>
</p>

</div>

</div>

</body>

</html>
