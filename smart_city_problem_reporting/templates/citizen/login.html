<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Citizen Login - Smart City</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background: linear-gradient(120deg,#1e3c72,#2a5298);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
}

.login-card{
width:400px;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.login-title{
text-align:center;
margin-bottom:25px;
}

.form-control{
border-radius:8px;
}

.btn-login{
width:100%;
border-radius:8px;
}

.register-link{
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>

<div class="login-card">

<div class="login-title">

<h3>
<i class="fa-solid fa-city"></i> Smart City
</h3>

<p>Citizen Login</p>

</div>

<form method="POST">

<div class="mb-3">

<label>Email</label>

<input type="email"
name="email"
class="form-control"
placeholder="Enter email"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>

<button class="btn btn-primary btn-login">

<i class="fa-solid fa-right-to-bracket"></i> Login

</button>

</form>

<div class="register-link">

<p>
Don't have an account?
<a href="/register">Register Here</a>
</p>

</div>

</div>

</body>

</html>
