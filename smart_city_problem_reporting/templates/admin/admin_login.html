<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .login-title {
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .login-subtitle {
            text-align: center;
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
            border: none;
            padding-left: 15px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .form-control::placeholder {
            color: #d1d5db;
        }

        .form-control:focus {
            box-shadow: 0 0 10px #60a5fa;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-login {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
        }

        .alert {
            border-radius: 12px;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #d1d5db;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h2 class="login-title">Admin Panel</h2>

            <p class="login-subtitle">
                Secure Login Access
            </p>

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter Username"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter Password"
                        required>

                </div>

                <button type="submit" class="btn-login">
                    Login
                </button>

            </form>

            <div class="footer-text">
                © 2026 Admin Dashboard
            </div>

        </div>

    </div>

</body>

</html>
