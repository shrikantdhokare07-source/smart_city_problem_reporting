<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart City Admin Panel</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background:#f4f6f9;
font-family:Arial;
}

/* Sidebar */

.sidebar{
height:100vh;
background:#212529;
color:white;
position:fixed;
width:230px;
padding-top:20px;
}

.sidebar a{
color:white;
display:block;
padding:12px 20px;
text-decoration:none;
}

.sidebar a:hover{
background:#0d6efd;
}

/* Main Content */

.main-content{
margin-left:230px;
padding:20px;
}

/* Topbar */

.topbar{
background:white;
padding:10px 20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:20px;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h4 class="text-center mb-4">
<i class="fa-solid fa-city"></i> Smart City
</h4>

<a href="/admin/dashboard">
<i class="fa-solid fa-gauge"></i> Dashboard
</a>

<a href="/admin/complaints">
<i class="fa-solid fa-list"></i> Manage Complaints
</a>

<a href="/admin/reports">
<i class="fa-solid fa-chart-column"></i> Reports
</a>



<a href="/admin/manage_users">
<i class="fa-solid fa-users"></i> Manage Users
</a>

<a href="/logout">
<i class="fa-solid fa-right-from-bracket"></i> Logout
</a>

</div>

<!-- Main Content -->

<div class="main-content">

<div class="topbar">

<h5>Admin Panel</h5>

</div>

{% block content %}

{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
